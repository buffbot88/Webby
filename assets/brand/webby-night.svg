    <path d="M1516 486 L1550 366 L1584 486 Z" fill="#0A1F38"/>
    <rect x="1547" y="348" width="6" height="20" fill="#0D2743"/>
    <path d="M1504 510 L1550 366" fill="none" stroke="#9FD4FF" stroke-opacity="0.22" stroke-width="1.6"/>
    <!-- tower 2 -->
    <path d="M1610 872 L1620 400 L1700 400 L1710 872 Z" fill="url(#towerFace)"/>
    <path d="M1614 400 h92 v-26 h-92 Z" fill="#0D2743"/>
    <path d="M1626 374 L1660 204 L1694 374 Z" fill="#0A1F38"/>
    <rect x="1657" y="186" width="6" height="20" fill="#0D2743"/>
    <path d="M1610 400 L1660 204" fill="none" stroke="#9FD4FF" stroke-opacity="0.24" stroke-width="1.8"/>
