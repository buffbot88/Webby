<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Midnight fantasy valley with a distant citadel">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030914"/>
      <stop offset="0.24" stop-color="#051125"/>
      <stop offset="0.44" stop-color="#0A2A4C"/>
      <stop offset="0.52" stop-color="#0E3660"/>
      <stop offset="0.6" stop-color="#071B33"/>
      <stop offset="1" stop-color="#030A15"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="1180" cy="760" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4EA8FF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#2A6BB8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#030914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="1180" cy="300" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCEBFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#8FC4FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#030914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="1120" cy="250" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F8FF"/>
      <stop offset="0.7" stop-color="#CFE2FA"/>
      <stop offset="1" stop-color="#9FBEE4"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FC8F2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9FC8F2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9FC8F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="860" x2="0" y2="1440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2440"/>
      <stop offset="0.35" stop-color="#07182C"/>
      <stop offset="1" stop-color="#030A14"/>
    </linearGradient>
    <linearGradient id="vignetteY" x1="0" y1="0" x2="0" y2="1440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#02080F" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#02080F" stop-opacity="0"/>
      <stop offset="1" stop-color="#02070D" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="vignetteX" x1="0" y1="0" x2="2560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#02080F" stop-opacity="0.42"/>
      <stop offset="0.28" stop-color="#02080F" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#02080F" stop-opacity="0"/>
      <stop offset="1" stop-color="#02080F" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurTiny" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#horizonGlow)"/>

  <g fill="#EAF3FF">
    <g opacity="0.85">
      <circle cx="180" cy="120" r="1.6"/><circle cx="320" cy="240" r="1.2"/><circle cx="470" cy="96" r="1.4"/>
      <circle cx="610" cy="300" r="1.1"/><circle cx="760" cy="150" r="1.7"/><circle cx="905" cy="70" r="1.2"/>
      <circle cx="1040" cy="210" r="1.3"/><circle cx="1300" cy="120" r="1.5"/><circle cx="1450" cy="260" r="1.1"/>
      <circle cx="1600" cy="86" r="1.6"/><circle cx="1760" cy="220" r="1.2"/><circle cx="1920" cy="130" r="1.4"/>
      <circle cx="2080" cy="280" r="1.1"/><circle cx="2230" cy="110" r="1.6"/><circle cx="2400" cy="200" r="1.3"/>
      <circle cx="2520" cy="330" r="1.1"/>
    </g>
    <g opacity="0.5">
      <circle cx="250" cy="380" r="1.1"/><circle cx="395" cy="180" r="1"/><circle cx="540" cy="420" r="1.2"/>
      <circle cx="690" cy="360" r="1"/><circle cx="840" cy="440" r="1.1"/><circle cx="990" cy="330" r="1"/>
      <circle cx="1180" cy="60" r="1.2"/><circle cx="1240" cy="470" r="1"/><circle cx="1390" cy="410" r="1.1"/>
      <circle cx="1520" cy="360" r="1"/><circle cx="1680" cy="440" r="1.2"/><circle cx="1850" cy="380" r="1"/>
      <circle cx="2000" cy="470" r="1.1"/><circle cx="2160" cy="420" r="1"/><circle cx="2320" cy="500" r="1.1"/>
      <circle cx="2470" cy="440" r="1"/>
    </g>
    <g opacity="0.32">
      <circle cx="420" cy="620" r="1"/><circle cx="700" cy="580" r="0.9"/><circle cx="960" cy="640" r="1"/>
      <circle cx="1330" cy="600" r="0.9"/><circle cx="1580" cy="560" r="1"/><circle cx="2200" cy="620" r="0.9"/>
      <circle cx="2450" cy="580" r="1"/>
    </g>
  </g>

  <circle cx="1180" cy="300" r="360" fill="url(#moonGlow)"/>
  <circle cx="1180" cy="300" r="128" fill="url(#moonBody)"/>
  <g fill="#B9D3EF" opacity="0.35">
    <circle cx="1140" cy="266" r="22"/><circle cx="1226" cy="336" r="15"/><circle cx="1164" cy="352" r="10"/>
  </g>

  <!-- distant ranges -->
  <path d="M0 700 L180 620 L340 668 L520 566 L700 646 L860 590 L1020 660 L1180 596 L1340 656 L1520 588 L1700 650 L1880 596 L2060 660 L2240 604 L2420 656 L2560 612 L2560 820 L0 820 Z"
        fill="#123150" opacity="0.85"/>
  <path d="M0 760 L200 700 L400 752 L600 686 L800 748 L1000 692 L1200 752 L1400 690 L1600 750 L1800 694 L2000 756 L2200 700 L2400 754 L2560 712 L2560 900 L0 900 Z"
        fill="#0C2440" opacity="0.92"/>

  <!-- citadel on the right -->
  <g>
    <path d="M1660 820 L1720 760 L1800 796 L1860 716 L1930 772 L1990 700 L2060 764 L2130 690 L2200 758 L2270 712 L2340 780 L2420 736 L2480 800 L2560 762 L2560 900 L1660 900 Z"
          fill="#081A2E"/>
    <path d="M1710 774 L1732 646 L1754 774 Z" fill="#0A1F38"/>
    <rect x="1726" y="612" width="12" height="40" fill="#0A1F38"/>
    <path d="M1870 736 L1892 596 L1914 736 Z" fill="#0A1F38"/>
    <path d="M1908 700 L1936 566 L1964 700 Z" fill="#0D2743"/>
    <path d="M2000 716 L2024 560 L2048 716 Z" fill="#0A1F38"/>
    <rect x="2014" y="520" width="16" height="46" fill="#0A1F38"/>
    <path d="M2140 712 L2166 578 L2192 712 Z" fill="#0D2743"/>
    <path d="M2300 748 L2320 636 L2340 748 Z" fill="#0A1F38"/>
    <path d="M2410 760 L2436 654 L2462 760 Z" fill="#0D2743"/>
    <!-- warm window lights -->
    <g fill="#E1BC72" opacity="0.75">
      <rect x="1730" y="712" width="6" height="10"/><rect x="1744" y="724" width="6" height="10"/>
      <rect x="1896" y="666" width="6" height="10"/><rect x="1912" y="690" width="6" height="10"/>
      <rect x="1926" y="636" width="6" height="10"/><rect x="1948" y="650" width="6" height="10"/>
      <rect x="2010" y="642" width="6" height="10"/><rect x="2028" y="668" width="6" height="10"/>
      <rect x="2156" y="652" width="6" height="10"/><rect x="2172" y="674" width="6" height="10"/>
      <rect x="2312" y="690" width="6" height="10"/><rect x="2432" y="704" width="6" height="10"/>
    </g>
    <!-- waterfall light -->
    <rect x="2050" y="820" width="10" height="70" fill="#9FD4FF" opacity="0.22" filter="url(#blurTiny)"/>
  </g>

  <!-- near ridges -->
  <path d="M0 860 L220 800 L420 852 L640 792 L880 856 L1100 800 L1320 858 L1560 806 L1780 862 L2000 812 L2240 868 L2460 820 L2560 852 L2560 980 L0 980 Z"
        fill="#071829"/>

  <!-- mist bands -->
  <g filter="url(#blurSoft)">
    <ellipse cx="900" cy="880" rx="720" ry="50" fill="url(#mist)"/>
    <ellipse cx="1900" cy="830" rx="620" ry="44" fill="url(#mist)"/>
    <ellipse cx="1400" cy="940" rx="900" ry="40" fill="url(#mist)"/>
    <ellipse cx="400" cy="960" rx="520" ry="38" fill="url(#mist)"/>
  </g>

  <!-- lake -->
  <rect x="0" y="940" width="2560" height="500" fill="url(#water)"/>
  <g opacity="0.22" filter="url(#blurTiny)" fill="#9FD4FF">
    <rect x="1148" y="960" width="64" height="330"/>
    <rect x="1892" y="980" width="86" height="230"/>
    <rect x="2030" y="990" width="40" height="190"/>
    <rect x="2300" y="1000" width="52" height="140"/>
  </g>
  <g stroke="#8FC8FF" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round">
    <path d="M980 1010 H1560"/><path d="M1080 1060 H1660"/><path d="M900 1116 H1500"/>
    <path d="M1180 1180 H1820"/><path d="M860 1246 H1420"/><path d="M1240 1310 H1900"/>
    <path d="M940 1372 H1520"/>
  </g>

  <!-- foreground rock shelf -->
  <path d="M0 1180 L260 1120 L560 1200 L840 1140 L1080 1230 L1180 1440 L0 1440 Z" fill="#050F1C" opacity="0.92"/>
  <path d="M2560 1160 L2320 1112 L2100 1190 L1900 1146 L1740 1250 L1700 1440 L2560 1440 Z" fill="#050F1C" opacity="0.8"/>

  <rect width="2560" height="1440" fill="url(#vignetteY)"/>
  <rect width="2560" height="1440" fill="url(#vignetteX)"/>
</svg>
