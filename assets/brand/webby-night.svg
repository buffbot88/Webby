  <path d="M0 700 L140 636 L300 686 L470 600 L640 672 L810 616 L980 690 L1150 628 L1330 700 L1520 640 L1700 706 L1880 648 L2060 712 L2250 660 L2430 716 L2560 678"
        fill="none" stroke="#8DC2F0" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M0 772 L210 706 L420 762 L630 700 L840 768 L1050 710 L1260 774 L1470 714 L1680 778 L1890 720 L2100 782 L2310 726 L2520 786 L2560 758 L2560 930 L0 930 Z"
        fill="#0C2440" opacity="0.9"/>
  <path d="M0 772 L210 706 L420 762 L630 700 L840 768 L1050 710 L1260 774 L1470 714 L1680 778 L1890 720 L2100 782 L2310 726 L2520 786 L2560 758"
