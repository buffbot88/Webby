      <circle cx="600" cy="304" r="1.2"/><circle cx="742" cy="150" r="1.8"/><circle cx="890" cy="72" r="1.3"/>
      <circle cx="1024" cy="214" r="1.4"/><circle cx="1160" cy="110" r="1.6"/><circle cx="1300" cy="262" r="1.2"/>
      <circle cx="1436" cy="140" r="1.7"/><circle cx="1570" cy="60" r="1.4"/><circle cx="2110" cy="150" r="1.6"/>
      <circle cx="2260" cy="230" r="1.3"/><circle cx="2400" cy="104" r="1.7"/><circle cx="2510" cy="300" r="1.2"/>
      <circle cx="1960" cy="88" r="1.5"/><circle cx="1740" cy="52" r="1.3"/><circle cx="660" cy="430" r="1.2"/>
    </g>
    <g opacity="0.52">
      <circle cx="230" cy="392" r="1.2"/><circle cx="378" cy="186" r="1.1"/><circle cx="528" cy="420" r="1.3"/>
      <circle cx="684" cy="352" r="1.1"/><circle cx="830" cy="446" r="1.2"/><circle cx="978" cy="338" r="1.1"/>
      <circle cx="1128" cy="62" r="1.3"/><circle cx="1236" cy="470" r="1.1"/><circle cx="1382" cy="408" r="1.2"/>
      <circle cx="1516" cy="352" r="1.1"/><circle cx="1666" cy="440" r="1.3"/><circle cx="2200" cy="392" r="1.1"/>
      <circle cx="2330" cy="470" r="1.2"/><circle cx="2456" cy="420" r="1.1"/><circle cx="1876" cy="176" r="1.2"/>
      <circle cx="2540" cy="540" r="1.1"/>
    </g>
    <g opacity="0.3">
      <circle cx="410" cy="620" r="1"/><circle cx="690" cy="578" r="0.9"/><circle cx="952" cy="642" r="1"/>
      <circle cx="1322" cy="598" r="0.9"/><circle cx="1572" cy="556" r="1"/><circle cx="2180" cy="616" r="0.9"/>
      <circle cx="2436" cy="580" r="1"/><circle cx="1080" cy="520" r="0.9"/>
    </g>
  </g>

  <!-- moon: backlight for the citadel -->
  <circle cx="1890" cy="290" r="430" fill="url(#moonGlow)"/>
  <circle cx="1890" cy="290" r="138" fill="url(#moonBody)"/>
  <g fill="#B9D3EF" opacity="0.32">
