  <path d="M0 848 L240 786 L480 852 L720 792 L960 856 L1200 798 L1440 862 L1680 802 L1920 866 L2160 808 L2400 872 L2560 836 L2560 970 L0 970 Z"
        fill="#081A2E" opacity="0.94"/>
