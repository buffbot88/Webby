    <path d="M2176 520 h68 v-24 h-68 Z" fill="#0D2743"/>
    <path d="M2186 496 L2210 384 L2234 496 Z" fill="#0A1F38"/>
    <path d="M2172 520 L2210 384" fill="none" stroke="#9FD4FF" stroke-opacity="0.16" stroke-width="1.6"/>
    <!-- tower 8 -->
    <path d="M2280 872 L2288 620 L2344 620 L2352 872 Z" fill="url(#towerFace)"/>
    <path d="M2284 620 h64 v-22 h-64 Z" fill="#0D2743"/>
    <path d="M2294 598 L2316 518 L2338 598 Z" fill="#0A1F38"/>
    <!-- tower 9 -->
    <path d="M2382 872 L2390 660 L2442 660 L2450 872 Z" fill="url(#towerFace)"/>
    <path d="M2386 660 h60 v-22 h-60 Z" fill="#0D2743"/>
    <path d="M2396 638 L2416 574 L2436 638 Z" fill="#0A1F38"/>
  </g>

  <!-- citadel: warm window lights, three tiers -->
  <g fill="#E1BC72" opacity="0.78">
    <rect x="1522" y="556" width="6" height="11"/><rect x="1552" y="556" width="6" height="11"/>
    <rect x="1522" y="606" width="6" height="11"/><rect x="1574" y="606" width="6" height="11"/>
    <rect x="1522" y="656" width="6" height="11"/><rect x="1552" y="656" width="6" height="11"/><rect x="1574" y="656" width="6" height="11"/>
    <rect x="1632" y="452" width="6" height="11"/><rect x="1664" y="452" width="6" height="11"/><rect x="1692" y="452" width="6" height="11"/>
    <rect x="1632" y="506" width="6" height="11"/><rect x="1692" y="506" width="6" height="11"/>
    <rect x="1632" y="560" width="6" height="11"/><rect x="1664" y="560" width="6" height="11"/>
    <rect x="1744" y="586" width="6" height="11"/><rect x="1776" y="586" width="6" height="11"/>
    <rect x="1744" y="640" width="6" height="11"/><rect x="1776" y="640" width="6" height="11"/>
    <rect x="1852" y="368" width="7" height="12"/><rect x="1900" y="368" width="7" height="12"/>
    <rect x="1852" y="430" width="7" height="12"/><rect x="1876" y="430" width="7" height="12"/><rect x="1900" y="430" width="7" height="12"/>
    <rect x="1852" y="496" width="7" height="12"/><rect x="1900" y="496" width="7" height="12"/>
    <rect x="1852" y="562" width="7" height="12"/><rect x="1876" y="562" width="7" height="12"/>
    <rect x="1980" y="518" width="6" height="11"/><rect x="2012" y="518" width="6" height="11"/>
    <rect x="1980" y="572" width="6" height="11"/><rect x="2012" y="572" width="6" height="11"/>
    <rect x="1980" y="700" width="6" height="11"/><rect x="2012" y="700" width="6" height="11"/>
    <rect x="2086" y="628" width="6" height="11"/><rect x="2116" y="628" width="6" height="11"/>
    <rect x="2086" y="682" width="6" height="11"/><rect x="2116" y="682" width="6" height="11"/>
    <rect x="2192" y="566" width="6" height="11"/><rect x="2222" y="566" width="6" height="11"/>
    <rect x="2192" y="622" width="6" height="11"/><rect x="2222" y="622" width="6" height="11"/>
    <rect x="2298" y="664" width="6" height="11"/><rect x="2324" y="664" width="6" height="11"/>
    <rect x="2398" y="700" width="6" height="11"/><rect x="2420" y="700" width="6" height="11"/>
  </g>
  <g fill="#E1BC72" opacity="0.3">
    <rect x="1522" y="556" width="6" height="11"/><rect x="1692" y="452" width="6" height="11"/>
    <rect x="1900" y="430" width="7" height="12"/><rect x="2012" y="572" width="6" height="11"/>
    <rect x="2222" y="622" width="6" height="11"/>
  </g>

  <!-- citadel: cascading waterfalls -->
  <g opacity="0.6" filter="url(#blurTiny)" fill="url(#fall)">
    <rect x="1660" y="906" width="86" height="150"/>
    <rect x="1930" y="906" width="104" height="132"/>
    <rect x="2100" y="906" width="58" height="104"/>
  </g>
  <g fill="url(#fall)">
    <rect x="1692" y="902" width="18" height="164"/>
    <rect x="1972" y="902" width="22" height="146"/>
    <rect x="2120" y="902" width="14" height="112"/>
  </g>
  <g stroke="#DCF0FF" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round">
    <path d="M1701 908 V1058"/><path d="M1983 908 V1042"/><path d="M2127 908 V1010"/>
  </g>

  <!-- mist: warm bands crossing the citadel base plus a low drift -->
  <g filter="url(#blurSoft)">
    <ellipse cx="840" cy="884" rx="760" ry="52" fill="url(#mist)"/>
    <ellipse cx="1880" cy="852" rx="680" ry="46" fill="url(#mist)"/>
    <ellipse cx="2280" cy="918" rx="560" ry="42" fill="url(#mist)"/>
    <ellipse cx="1320" cy="946" rx="920" ry="42" fill="url(#mist)"/>
    <ellipse cx="380" cy="972" rx="560" ry="40" fill="url(#mist)"/>
    <ellipse cx="1700" cy="1030" rx="1020" ry="38" fill="url(#mist)"/>
  </g>

  <!-- lake: moon path, citadel reflection, ripples -->
  <rect x="0" y="1000" width="2560" height="440" fill="url(#water)"/>
  <g opacity="0.26" filter="url(#blurTiny)" fill="#9FD4FF">
    <rect x="1856" y="1010" width="76" height="310"/>
    <rect x="1690" y="1030" width="54" height="230"/>
    <rect x="1972" y="1040" width="62" height="200"/>
    <rect x="2114" y="1050" width="40" height="150"/>
  </g>
  <g opacity="0.14" filter="url(#blurTiny)" fill="#E1BC72">
    <rect x="1690" y="1012" width="120" height="42"/>
    <rect x="1970" y="1012" width="90" height="34"/>
  </g>
  <g stroke="#8FC8FF" stroke-opacity="0.13" stroke-width="3" stroke-linecap="round">
