      <stop offset="0.55" stop-color="#02080F" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#02080F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignetteY" x1="0" y1="0" x2="0" y2="1440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#02080F" stop-opacity="0.6"/>
      <stop offset="0.34" stop-color="#02080F" stop-opacity="0"/>
      <stop offset="1" stop-color="#02070D" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="vignetteX" x1="0" y1="0" x2="2560" y2="0" gradientUnits="userSpaceOnUse">
