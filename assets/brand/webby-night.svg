  <path d="M0 1180 L260 1120 L560 1200 L840 1140 L1080 1230 L1180 1440 L0 1440 Z" fill="#050F1C" opacity="0.92"/>
  <path d="M2560 1160 L2320 1112 L2100 1190 L1900 1146 L1740 1250 L1700 1440 L2560 1440 Z" fill="#050F1C" opacity="0.82"/>

  <!-- shading: negative space for the interface, then vignettes -->
  <rect width="1250" height="1440" fill="url(#leftShade)"/>
  <rect width="2560" height="1440" fill="url(#vignetteY)"/>
  <rect width="2560" height="1440" fill="url(#vignetteX)"/>
</svg>
