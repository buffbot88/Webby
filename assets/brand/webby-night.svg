<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Midnight fantasy valley with a lit citadel and cascading waterfalls">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030914"/>
      <stop offset="0.22" stop-color="#051125"/>
      <stop offset="0.42" stop-color="#0A2A4C"/>
      <stop offset="0.51" stop-color="#103A66"/>
      <stop offset="0.6" stop-color="#071B33"/>
      <stop offset="1" stop-color="#030A15"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="1760" cy="780" r="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4EA8FF" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#2A6BB8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#030914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="1890" cy="290" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCEBFF" stop-opacity="0.6"/>
      <stop offset="0.32" stop-color="#8FC4FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#030914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="1852" cy="252" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F9FF"/>
      <stop offset="0.68" stop-color="#D2E4FB"/>
      <stop offset="1" stop-color="#A2C1E6"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FC8F2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9FC8F2" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#9FC8F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="1000" x2="0" y2="1440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C2A4A"/>
      <stop offset="0.3" stop-color="#07182C"/>
      <stop offset="1" stop-color="#030A14"/>
