    <rect x="1882" y="86" width="7" height="22" fill="#0D2743"/>
    <circle cx="1885" cy="80" r="7" fill="#9FD4FF" opacity="0.4"/>
    <path d="M1824 320 L1885 104" fill="none" stroke="#9FD4FF" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M1946 320 L1928 292" fill="none" stroke="#9FD4FF" stroke-opacity="0.16" stroke-width="1.6"/>
    <!-- tower 5 -->
