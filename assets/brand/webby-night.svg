      <stop offset="0.26" stop-color="#02080F" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#02080F" stop-opacity="0"/>
      <stop offset="1" stop-color="#02080F" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-60%" width="140%" height="220%">
