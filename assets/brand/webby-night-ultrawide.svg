<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3440 1440" width="3440" height="1440" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Midnight fantasy valley, ultrawide with a lit citadel and cascading waterfalls">
