<div class="app-shell" data-route="{{slot:route}}">

  <div class="app-background" aria-hidden="true">
    <div class="app-background-art"></div>
    <div class="app-background-stars"></div>
  </div>

  <nav class="nav-rail" aria-label="Primary">
    <div class="rail-logo">{{slot:railLogo}}</div>
    <div class="rail-items">{{slot:rail}}</div>
  </nav>

  <div class="app-main">

    <header class="topbar">

      <div class="topbar-brand">
        {{slot:brand}}
      </div>

      <div class="topbar-search">
        {{slot:search}}
      </div>

      <div class="topbar-actions">
        {{slot:nav}}
      </div>

    </header>

    <main id="layout-slot">
      {{slot:main}}
    </main>

  </div>

  <nav class="bottom-nav" aria-label="Primary mobile">
    {{slot:rail}}
  </nav>

</div>
